<!-- =========================================================
     avatar.svg — 抽象小人头像（占位图形，与蓝紫主题一致）
     如需替换成自己的素材：见 README「更换头像」
     ========================================================= -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img" aria-label="Abstract portrait icon">
  <defs>
    <linearGradient id="iris" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9BA8F0"/>
      <stop offset="0.55" stop-color="#6C63D9"/>
      <stop offset="1" stop-color="#4A44B0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="frame"><circle cx="200" cy="200" r="200"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <!-- 底色：鸢尾紫渐变 -->
    <rect width="400" height="400" fill="url(#iris)"/>
    <!-- 顶部柔光 -->
    <rect width="400" height="400" fill="url(#glow)"/>
    <!-- 装饰光环：呼应 VR / 情绪波纹 -->
    <circle cx="200" cy="196" r="150" fill="none" stroke="#FFFFFF" stroke-opacity="0.16" stroke-width="2"/>
    <circle cx="200" cy="196" r="176" fill="none" stroke="#FFFFFF" stroke-opacity="0.10" stroke-width="2"/>

    <!-- 抽象小人 -->
    <g fill="#FFFFFF">
      <circle cx="200" cy="150" r="52" fill-opacity="0.96"/>
      <path d="M200 216c-52 0-84 34-90 84a4 4 0 0 0 4 4h172a4 4 0 0 0 4-4c-6-50-38-84-90-84z" fill-opacity="0.92"/>
    </g>
    <!-- 胸前的小小“拥抱”弧线，暗示 HUG 主题 -->
    <path d="M200 258c-14 10-30 12-44 6M200 258c14 10 30 12 44 6" stroke="#4A44B0" stroke-opacity="0.45" stroke-width="5" stroke-linecap="round" fill="none"/>
  </g>
  <!-- 外圈描边 -->
  <circle cx="200" cy="200" r="199" fill="none" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="2"/>
</svg>
